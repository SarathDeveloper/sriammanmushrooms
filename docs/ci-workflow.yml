# GitHub Actions CI for this repo. To enable, save as .github/workflows/ci.yml
# (e.g. GitHub web UI: Add file > Create new file). Kept here because pushing
# workflow files from the CLI needs a token with the `workflow` scope.

name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/app_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
      NEXTAUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: demo
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy

      - name: Migrations match schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - run: npm run lint
      - run: npm run typecheck

      - name: Tests (unit + integration against Postgres)
        run: npm test

      - name: Seed and build
        run: |
          npx prisma db seed
          npm run build
